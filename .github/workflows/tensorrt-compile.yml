name: tensorrt-compile

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/helios/runtime/**"
      - "src/runtime/**"
      - "tests/tensorrt_compile_smoke.cpp"
      - ".github/workflows/tensorrt-compile.yml"

jobs:
  compile:
    runs-on: ubuntu-24.04
    # TensorRT 10.3 / CUDA 12.6, pinned to the digest resolved by the first successful PR build.
    container: nvcr.io/nvidia/tensorrt:24.08-py3@sha256:9507e5f248fc61a5b2c985ce6e386ecf2576c3d96112ceb38cf88b240d4ca072
    steps:
      - uses: actions/checkout@v4
      - name: Configure TensorRT 10 baseline
        run: cmake -S . -B build-gpu -DHELIOS_ENABLE_CUDA=ON -DHELIOS_BUILD_TESTS=OFF
      - name: Compile and link TensorRT executor
        run: cmake --build build-gpu --target tensorrt_compile_smoke --parallel 2
